name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 매일 00:10 (KST) 재빌드: 프로모션 종료일 등 날짜 기준 표시를 자동 갱신
    - cron: "10 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build and upload Astro site
        uses: withastro/action@v6
        env:
          SITE_URL: https://prepaid1215.github.io
          BASE_PATH: /ntelecom-budget-phone
          PRODUCTION_READY: "true"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
