name: Start funnel static build checks

on:
  push:
    branches: [feat/start-conversion-funnel]
  pull_request:
    paths:
      - "src/pages/start/**"
      - "src/lib/site-config.js"
      - "src/layouts/BaseLayout.astro"
      - "src/components/HomePlanFinder.astro"
      - "src/components/PlanCard.astro"
      - "src/components/PlanDetail.astro"
      - "scripts/test-start-funnel.mjs"
      - ".github/workflows/start-funnel-check.yml"

permissions:
  contents: read

jobs:
  start-funnel:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://xn--h49a29twjdmms77a5sofgdjwa.shop
      BASE_PATH: /
      PRODUCTION_READY: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: node scripts/test-start-funnel.mjs
