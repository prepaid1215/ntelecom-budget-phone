name: Audit original 500 MVNO pages

on:
  push:
    branches: [feat/seo-three-experiments-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-existing-500:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build pages in inspection mode (not deployed)
        uses: withastro/action@v6
        env:
          SITE_URL: https://xn--h49a29twjdmms77a5sofgdjwa.shop
          BASE_PATH: /
          PRODUCTION_READY: "true"
      - name: Audit 500 existing HTML pages
        run: node scripts/audit-existing-500.mjs
        env:
          SITE_URL: https://xn--h49a29twjdmms77a5sofgdjwa.shop
          PRODUCTION_READY: "true"
      - name: Upload audit details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-existing-500
          path: audit-results/
          if-no-files-found: warn
