name: Verify public domain discovery readiness

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-public-domain.yml"
      - ".github/workflows/deploy-pages.yml"
      - "src/pages/robots.txt.js"
      - "src/pages/sitemap.xml.js"
      - "src/lib/sitemap.js"
      - "src/data/site.json"
      - "src/data/seo-experiments/config.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-domain:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect public DNS, HTTPS, robots, sitemap and canonical
        shell: bash
        run: |
          set -uo pipefail
          DOMAIN="xn--h49a29twjdmms77a5sofgdjwa.shop"
          echo "::group::DNS from independent public resolvers"
          for resolver in 1.1.1.1 8.8.8.8; do
            echo "=== resolver $resolver ==="
            for record in NS A AAAA CNAME; do
              echo "$record:"
              dig +time=3 +tries=1 +short @"$resolver" "$DOMAIN" "$record" || true
            done
          done
          echo "::endgroup::"

          inspect () {
            local label="$1" url="$2" dest="$3" status
            echo "::group::$label ($url)"
            status=$(curl --silent --show-error --location --max-time 25 --connect-timeout 10 --output "$dest" --write-out '%{http_code}' "$url") || status="request_error"
            echo "HTTP status: $status"
            if [ "$status" = "200" ]; then
              case "$label" in
                *home*)
                  grep -oEi '<link rel="canonical"[^>]*>|<meta name="robots"[^>]*>|<meta name="google-site-verification"[^>]*>' "$dest" | head -n 8 || true
                  ;;
                *robots*)
                  head -n 12 "$dest" || true
                  ;;
                *sitemap*)
                  echo "URL count: $(grep -o '<loc>' "$dest" | wc -l)"
                  grep -o '<loc>[^<]*</loc>' "$dest" | head -n 3 || true
                  ;;
              esac
            fi
            echo "::endgroup::"
          }

          inspect "custom home" "https://$DOMAIN/" /tmp/custom-home.html
          inspect "custom robots" "https://$DOMAIN/robots.txt" /tmp/custom-robots.txt
          inspect "custom sitemap" "https://$DOMAIN/sitemap.xml" /tmp/custom-sitemap.xml
          inspect "Cloudflare production alias home" "https://6f44f373.ntelecom-budget-phone.pages.dev/" /tmp/cf-prod-home.html
          inspect "Cloudflare production alias robots" "https://6f44f373.ntelecom-budget-phone.pages.dev/robots.txt" /tmp/cf-prod-robots.txt
          inspect "Cloudflare production alias sitemap" "https://6f44f373.ntelecom-budget-phone.pages.dev/sitemap.xml" /tmp/cf-prod-sitemap.xml
          inspect "Cloudflare Pages default home" "https://ntelecom-budget-phone.pages.dev/" /tmp/cf-default-home.html
          inspect "Cloudflare Pages default robots" "https://ntelecom-budget-phone.pages.dev/robots.txt" /tmp/cf-default-robots.txt
          inspect "Cloudflare Pages default sitemap" "https://ntelecom-budget-phone.pages.dev/sitemap.xml" /tmp/cf-default-sitemap.xml
          inspect "Naver IndexNow key" "https://$DOMAIN/7be9bab21ea2fbefbb07353904211af3.txt" /tmp/indexnow-proof.txt
          if [ -f /tmp/indexnow-proof.txt ] && [ "$(tr -d '\\r\\n' < /tmp/indexnow-proof.txt)" = "7be9bab21ea2fbefbb07353904211af3" ]; then
            echo "NAVER_INDEXNOW_KEY: VERIFIED"
          else
            echo "NAVER_INDEXNOW_KEY: UNVERIFIED"
          fi
          inspect "GitHub Pages home" "https://prepaid1215.github.io/ntelecom-budget-phone/" /tmp/gh-home.html
          inspect "GitHub Pages robots" "https://prepaid1215.github.io/ntelecom-budget-phone/robots.txt" /tmp/gh-robots.txt
          inspect "GitHub Pages sitemap" "https://prepaid1215.github.io/ntelecom-budget-phone/sitemap.xml" /tmp/gh-sitemap.xml

          echo "Diagnostic only; deployment, Search Console verification, indexing and DNS are not modified."
